<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人工智能训练师（三级）刷题工作台 · 四川成都</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#141b2d; --ink2:#4b5675; --ink3:#8892ad;
  --line:#e4e8f2; --brand:#2c5cff; --brand-soft:#eaf0ff; --ok:#0f9d58; --ok-soft:#e6f6ee;
  --bad:#e5484d; --bad-soft:#fdeaea; --warn:#c77700; --warn-soft:#fff4e0;
  --shadow:0 8px 30px rgba(20,32,80,.08); --radius:16px;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0e1220; --panel:#171d2e; --ink:#eaeefb; --ink2:#a9b3cd; --ink3:#6d7896;
  --line:#26304a; --brand:#6f8dff; --brand-soft:#1d2743; --ok:#3ddc97; --ok-soft:#122c22;
  --bad:#ff6b6b; --bad-soft:#2d1618; --warn:#ffc061; --warn-soft:#2b2110;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
::selection{background:var(--brand-soft)}

/* ============ layout ============ */
.app{display:flex;min-height:100vh}
.side{
  width:224px;flex:0 0 224px;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{display:flex;gap:10px;align-items:center;padding:6px 10px 16px}
.logo .mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(135deg,#2c5cff,#7b5cff);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-.5px;box-shadow:0 6px 16px rgba(44,92,255,.35)
}
.logo b{display:block;font-size:14px;line-height:1.25}
.logo span{display:block;font-size:11px;color:var(--ink3)}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  color:var(--ink2);font-size:14px;font-weight:500;transition:.15s;width:100%;text-align:left;
}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-item .cnt{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--bg);color:var(--ink3);font-weight:700}
.nav-item.active .cnt{background:#fff;color:var(--brand)}
html[data-theme="dark"] .nav-item.active .cnt{background:var(--panel)}
.nav-sep{margin:12px 10px 6px;font-size:11px;color:var(--ink3);letter-spacing:1px;font-weight:700}
.side-foot{margin-top:auto;padding:10px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
.top h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
.top .sub{font-size:12px;color:var(--ink3);white-space:nowrap}
.spacer{flex:1}
.countdown{
  display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:12px;
  background:linear-gradient(135deg,#182a63,#2c5cff);color:#fff;font-weight:700;font-size:13px;
  box-shadow:0 6px 18px rgba(44,92,255,.3);white-space:nowrap
}
.countdown small{opacity:.75;font-weight:500;font-size:11px}
.countdown .num{font-family:var(--mono);font-size:15px;letter-spacing:.5px}
.countdown.urgent{background:linear-gradient(135deg,#7a1b1b,#e5484d);box-shadow:0 6px 18px rgba(229,72,77,.35)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);
  border:1px solid var(--line);background:var(--panel);font-size:15px;flex:0 0 36px;
}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.content{padding:22px;max-width:1080px;width:100%;margin:0 auto;flex:1}
@media(max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.25s;z-index:60;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .content{padding:14px}
  .top{padding:10px 14px}
  .top h1{font-size:14px}
  .top .sub{display:none}
}
.backdrop{display:none;position:fixed;inset:0;background:rgba(10,16,35,.45);z-index:55}
.backdrop.show{display:block}
@media(min-width:901px){.menu-btn{display:none}.backdrop{display:none!important}}

/* ============ cards ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.stat{padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink3);font-weight:600;margin-left:3px}
h2.sec{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2.sec .dot{width:4px;height:16px;border-radius:3px;background:var(--brand)}
.muted{color:var(--ink3);font-size:12.5px}

/* progress ring */
.ring{--p:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);position:relative;flex:0 0 92px}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font-size:19px;font-weight:800}
.ring b small{font-size:10px;color:var(--ink3)}

/* ============ question ============ */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--bg);color:var(--ink2)}
.pill.single{background:var(--brand-soft);color:var(--brand)}
.pill.multi{background:#f3ebff;color:#7b3fe4}
.pill.tf{background:#e7f7f2;color:#0b8a6a}
.pill.case{background:#fff1e2;color:#c26a00}
html[data-theme="dark"] .pill.multi{background:#2a1f3d;color:#c4a6ff}
html[data-theme="dark"] .pill.tf{background:#10291f;color:#4fd1a5}
html[data-theme="dark"] .pill.case{background:#2f2411;color:#ffb454}
.qno{font-weight:800;font-size:14px}
.stem{font-size:17px;font-weight:600;line-height:1.7;margin:0 0 18px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--panel);transition:.12s;text-align:left;width:100%;
  font-size:15px;line-height:1.6;
}
.opt:hover:not(.locked){border-color:var(--brand);background:var(--brand-soft)}
.opt .k{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;
  background:var(--bg);font-weight:800;font-size:13px;color:var(--ink2);margin-top:1px;
}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .tag{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
.opt.right .tag{background:var(--ok);color:#fff}
.opt.wrong .tag{background:var(--bad);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}

.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{
  padding:10px 20px;border-radius:11px;font-weight:700;font-size:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink2);transition:.15s;display:inline-flex;align-items:center;gap:7px
}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(44,92,255,.28)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink3)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.feedback span{overflow-wrap:anywhere}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.mid{background:var(--warn-soft);color:var(--warn)}
.explain{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;white-space:pre-wrap;font-size:14px;color:var(--ink2);line-height:1.75}
.explain .lbl{font-weight:800;color:var(--ink);display:block;margin-bottom:6px;font-size:13px}
.issue{
  margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--warn-soft);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:13.5px;line-height:1.7;color:var(--ink);
  overflow-wrap:anywhere
}
.issue .hd{font-weight:800;color:var(--warn);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.issue .sug{font-weight:700;color:var(--ink)}
.issue.hi{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.issue.hi .hd{color:var(--bad)}
.issue.info{border-color:color-mix(in srgb,var(--brand) 35%,transparent);background:var(--brand-soft)}
.issue.info .hd{color:var(--brand)}

/* answer sheet */
.sheet{display:flex;flex-wrap:wrap;gap:7px}
.sheet button{
  width:34px;height:34px;border-radius:9px;font-weight:700;font-size:12.5px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink2);transition:.12s
}
.sheet button:hover{border-color:var(--brand)}
.sheet button.cur{outline:2px solid var(--brand);outline-offset:1px}
.sheet button.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.sheet button.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.sheet button.done{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 35%,transparent);color:var(--brand)}
.sheet button.flag::after{content:"●";position:absolute}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* exam */
.exambar{display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.exambar .t{font-family:var(--mono);font-size:24px;font-weight:800;letter-spacing:1px}
.exambar.danger .t{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.qbar{height:5px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:120px}
.qbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:.3s}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .no{width:34px;flex:0 0 34px;font-weight:800;color:var(--ink3);font-size:12.5px;font-family:var(--mono)}
.row .body{flex:1;min-width:0}
.row .body p{margin:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.row .meta{font-size:11.5px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.row:hover .body p{color:var(--brand)}

.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5}

/* charts */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:88px 1fr 54px;align-items:center;gap:10px;font-size:12.5px}
.bar .track{height:9px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2c5cff,#7b5cff)}
.bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,35,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal.show{display:flex}
.modal .box{background:var(--panel);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h3{margin:0 0 16px;font-size:17px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.field label{font-size:13.5px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--ink3);font-weight:400;display:block;margin-top:1px}
input[type=text],input[type=date],input[type=number],select,textarea{
  font-family:inherit;font-size:13.5px;padding:8px 11px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);outline:none;min-width:0
}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{width:100%;resize:vertical;min-height:70px;line-height:1.6}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#101828;color:#fff;padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;
  z-index:200;transition:.25s;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%)}

.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--ink3);background:var(--bg)}
.hide{display:none!important}
@media(max-width:640px){
  .stem{font-size:16px}
  .opt{font-size:14.5px;padding:12px 13px}
  .exambar .t{font-size:20px}
  .stat .v{font-size:22px}
}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo">
      <div class="mark">AI</div>
      <div><b>刷题工作台</b><span>AI训练师 · 三级/高级工</span></div>
    </div>
    <button class="nav-item active" data-view="home"><span class="ic">◉</span>学习首页</button>
    <button class="nav-item" data-view="practice"><span class="ic">✎</span>顺序练习</button>
    <button class="nav-item" data-view="random"><span class="ic">⤨</span>随机练习</button>
    <button class="nav-item" data-view="exam"><span class="ic">⏱</span>模拟考试</button>
    <div class="nav-sep">专 项</div>
    <button class="nav-item" data-view="wrong"><span class="ic">✗</span>错题集<span class="cnt" id="cWrong">0</span></button>
    <button class="nav-item" data-view="fav"><span class="ic">★</span>收藏夹<span class="cnt" id="cFav">0</span></button>

    <div class="nav-sep">数 据</div>
    <button class="nav-item" data-view="stats"><span class="ic">▤</span>学习统计</button>
    <div class="side-foot">
      <button class="btn ghost sm" id="btnTheme">◐ 深色模式</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="btnMenu">☰</button>
      <h1 id="pageTitle">学习首页</h1>
      <span class="sub" id="pageSub"></span>
      <span class="spacer"></span>
      <div class="countdown" id="cdExam" title="点击设置考试日期">
        <small>距考试</small><span class="num" id="cdExamNum">--</span>
      </div>
      <button class="icon-btn" id="btnSettings" title="设置">⚙</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

。","options":[{"k":"A","t":"降低数据量"},{"k":"B","t":"加快模型收敛"},{"k":"C","t":"提高模型泛化能力"},{"k":"D","t":"加快模型推理速度"},{"k":"E","t":"加快模型推理能力"}],"answer":"ABC","marked":"CDE","explain":"","id":288,"chapter":"模型评估与测试"},{"no":290,"type":"multi","stem":"小明正在评估一个二分类模型，并希望使用ROC曲线和AUC来评估模型性能。以下（ ）选项是关于ROC曲线和AUC的正确描述。","options":[{"k":"A","t":"ROC曲线是受试者工作特征曲线的缩写"},{"k":"B","t":"ROC曲线的纵坐标表示真阳性率"},{"k":"C","t":"ROC曲线的横坐标表示假阳性率"},{"k":"D","t":"AUC表示ROC曲线下的面积"},{"k":"E","t":"AUC的取值范围是[-1, 1]"}],"answer":"ABCD","marked":"AB","explain":"","id":289,"chapter":"模型评估与测试"},{"no":291,"type":"multi","stem":"在数据处理规范制定中，音频数据标注的要求有（ ）。","options":[{"k":"A","t":"准确标注语音的开始和结束时间"},{"k":"B","t":"标记发音错误和语法错误"},{"k":"C","t":"标注口音和方言的变化"},{"k":"D","t":"识别并标注特定的语音特征"},{"k":"E","t":"注明说话者的身份"}],"answer":"ADE","marked":"BD","explain":"","id":290,"chapter":"数据标注"},{"no":292,"type":"case","stem":"在人工智能项目中，为什么数据清洗是一个重要的步骤？请列举至少两个理由。","options":[],"answer":"","marked":"","explain":"1.提高模型性能：数据清洗可以去除数据集中的噪声、异常值和错误数据，从而提高输入到模型中的数据质量。高质量的数据能够训练出更加准确和可靠的模型，提高模型的预测性能。 2.减少训练时间：清洗后的数据集通常更加紧凑和高效，这意味着模型在训练时能够更快地收敛，减少训练时间。此外，清洗后的数据还能减少模型在训练过程中的计算负担，提高训练效率。","id":291,"chapter":"案例分析"},{"no":293,"type":"case","stem":"某社交 APP 的 AI 内容推荐模型需处理文本、图像、短视频三类数据，三类数据的处理延迟要求差异显著（文本 < 1 秒，图像 < 3 秒，视频 < 10 秒）。设计处理流程时如何平衡效率与特征完整性？请说明 2 种核心策略。","options":[],"answer":"","marked":"","explain":"答：\n异构计算调度策略：文本用CPU集群处理，图像用GPU加速处理，视频采用“边缘预处理+云端深度学习”架构，通过动态资源分配满足不同延迟要求；\n特征层级处理策略：基础特征实时处理，高级特征异步批处理，AI模型采用“实时特征+缓存高级特征”的融合推理模式。","id":292,"chapter":"案例分析"},{"no":294,"type":"case","stem":"当训练的模型精准度、召回率等指标不足时可以通过哪些方法提高这些指标？","options":[],"answer":"","marked":"","explain":"答：\n①调整阈值：改变模型判断正类的临界值，以找到精准度和召回率之间的最佳平衡点。\n②处理数据不平衡：如果数据集不平衡，可以通过过采样或欠采样来平衡类别分布。\n③改进模型：尝试更复杂的模型或调整现有模型的参数。\n④特征工程：增加新特征或改进现有特征，以帮助模型更好地学习。\n⑤模型融合：结合多个模型的预测来提高整体性能。\n⑥分析错误：深入了解模型预测错误的类型，针对性地进行改进。\n⑦数据增强：增加数据的多样性，特别是在图像和文本数据上。","id":293,"chapter":"案例分析"},{"no":295,"type":"case","stem":"从数据处理角度，列举人工智能模型训练如何提高精准度和泛化能力？","options":[],"answer":"","marked":"","explain":"答：\n①数据预处理：填补缺失值、处理异常值、标准化/归一化、去重。\n②特征工程：选择重要特征、提取新特征。\n③数据分布调整：重采样、使用合成数据。\n④集成学习和迁移学习：结合多个模型或利用预训练模型。\n⑤模型验证与调优：使用交叉验证，调整参数。\n⑥避免过拟合和欠拟合：平衡模型复杂度和训练误差。","id":294,"chapter":"案例分析"},{"no":296,"type":"case","stem":"某数据处理流程包含 4 个串行环节，处理效率分别为：\n环节 1：每小时处理 1000 条（错误率 2%）\n环节 2：每小时处理800条（错误率1.5%）\n环节 3：每小时处理1200条（错误率 3%）\n环节 4：每小时处理1500条（错误率 1%）","options":[],"answer":"","marked":"","explain":"答：\n环节 1 输出： 10 万 ×(1-2%)=98,000 条，耗时：10 万 ÷1000=100 小时；\n环节 2 输出： 98,000×(1-1.5%)=96,530 条，耗时：98,000÷800=122.5 小时；\n环节 3 输出： 96,530×(1-3%)=93,634.1≈93,634 条，耗时：96,530÷1200≈80.44 小时；\n环节 4 输出： 93,634×(1-1%)=92,697.66≈92,698 条，耗时：93,634÷1500≈62.42 小时；","id":295,"chapter":"案例分析"},{"no":297,"type":"case","stem":"聊天机器人是一种经由对话或文字进行交谈的计算机软件程序，能够模拟人类对话并解决不同场景下的业务需求。随着人工智能、互联网等技术的发展，聊天机器人应用多重领域，在电信、旅游、医疗航空、金融等领域均有涉及，效果明显。人工智能技术突破了聊天机器人原有的技术瓶颈，并且实践证明，聊天机器人的使用不仅能够为企业减少一大笔人力成本，而且能够明显提高工作效率，国内外多家企业纷纷布局聊天机器人行业，聊天机器人市场一片蓝海。\n问题：\n1）详细描述聊天机器人里面用到了哪些人工智能技术，并描述其定义。\n2）详细描述协同工作的原理。","options":[],"answer":"","marked":"","explain":"答：1）聊天机器人依赖于多种人工智能技术来实现其功能，包括自然语言处理（NLP）、机器学习、深度学习、对话管理、语音识别和文本到语音转换等。\n①自然语言处理（NLP）：NLP是聊天机器人的核心技术之一。它帮助机器人理解和生成人类语言。NLP的任务包括语音识别、语言模型构建、语义理解、实体识别、情感分析等。\n②机器学习：机器学习在训练模型以改进对用户意图识别和对话管理的准确性和效率方面起着关键作用。\n③深度学习：深度学习通过神经网络提供强大的语义理解和语言生成能力。\n④对话管理：对话管理系统负责跟踪对话状态，决定机器在对话中的行为和回应。基于规则的系统、基于统计的系统及混合系统都是常见的方法。\n⑤语音识别和文本到语音转换：语音识别技术将语音输入转为文本，而文本到语音转换则是将生成的文本响应转换为自然语音，提升用户体验。\n2）协同工作的原理：协同工作是指多个人或机器共同朝着一个共同目标或解决某个问题进行的合作。\n其原理包括以下几个方面：\n①共享目标：协同工作需要参与者对目标有统一的理解和认识，确保所有行动都是为了实现同一个目标。\n②信息共享：参与者通过各种通信方式进行信息共享，这包括文件共享、实时消息、视频会议等，以确保所有成员对信息有统一的了解。\n③角色分配：在协同工作中，明确的角色分配至关重要。这涉及决定谁负责哪个任务，以便在资源和责任之间实现最佳平衡。\n④互补优势：协同工作常常依靠团队中各个参与者的互补优势，以便更有效地完成任务。每个成员可能具有不同的专长和能力，通过协同合作，能够充分发挥各自的长处。","id":296,"chapter":"案例分析"},{"no":298,"type":"case","stem":"对四级工开展智能快递柜数据采集技术培训时，需重点讲解“异常数据捕捉”技巧。结合“快递柜取件码失效导致用户投诉”案例，说明培训中应包含的2个关键知识点。","options":[],"answer":"","marked":"","explain":"答：时效异常捕捉：讲解如何设置取件码有效期（如24小时）预警，当超过12小时未取件时自动标记并推送提醒；\n交互日志关联：培训通过“用户点击‘重发取件码’次数> 3 次”判断系统异常，结合实际案例中因短信通道拥堵导致的失效问题。","id":297,"chapter":"案例分析"},{"no":299,"type":"case","stem":"人工智能算法模型开发过程中，模型研发分为哪几步，每一步需要做哪些工作？","options":[],"answer":"","marked":"","explain":"答：模型研发分以下几步：\n①问题定义：明确问题和模型的目标，确定所需的输入和期望的输出。\n②数据收集：搜集和整理用于训练和测试的数据。\n③数据预处理：处理数据，包括填补缺失值、处理异常值、数据标准化/归一化、数据去重等。\n④特征工程：选择、提取和构造有助于模型训练的特征。\n⑤模型选择：根据问题类型选择合适的算法或模型架构。\n⑥模型训练：使用训练数据集对模型进行训练。\n⑦模型验证：使用验证数据集评估模型的性能，进行超参数调优。","id":298,"chapter":"案例分析"},{"no":300,"type":"case","stem":"在进行数据聚类时，可能遇到哪些挑战？","options":[],"answer":"","marked":"","explain":"① 数据规模：处理大规模数据集时，聚类算法的效率和可扩展性成为一个挑战。 ② 数据维度：高维数据可能导致距离计算变得不那么有意义，影响聚类效果。 ③ 数据类型：不同类型的数据（如数值、分类、有序等）可能需要不同的距离度量或聚类方法。 ④ 噪声和异常值：噪声和异常值可能影响聚类结果，需要采用鲁棒性强的算法或在预处理中加以处理。 ⑤ 簇的数量：对于一些算法，需要预先指定簇的数量，而确定合适的簇数量可能是一个挑战。 ⑥ 局部最优：某些聚类算法可能会陷入局部最优解，而不是全局最优解。 ⑦ 解释性和可用性：聚类结果的解释性和如何将聚类结果有效应用于实际问题也是一个挑战。","id":299,"chapter":"案例分析"}]};
const QS = BANK.questions.map((q,i)=>({...q, idx:i}));

/* ================= 状态 ================= */
const LS_KEY = 'aitrainer_wb_v1';
const defaultState = ()=>({
  answers:{},          // qid -> {sel:'A', ok:bool, ts}
  wrong:[],            // 错题 qid 列表
  fav:[],              // 收藏
  doubt:[],            // 手动标记存疑
  notes:{},            // qid -> 笔记
  examDate:'',         // 考试日期 YYYY-MM-DD
  examTime:'09:00',
  settings:{duration:90, passScore:60, single:60, tf:20, multi:10, multiScore:2, shuffle:true},
  stats:{done:0, right:0, byDay:{}, streak:{last:'',n:0}},
  exam:null,           // 进行中的考试
  seqIdx:0
});
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    return Object.assign(defaultState(), s, {settings:Object.assign(defaultState().settings, s.settings||{})});
  }catch(e){ return defaultState(); }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ================= 工具 ================= */
const $ = s=>document.querySelector(s);
const el = (tag, cls, html)=>{ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }
const TYPE_LABEL = {single:'单选题', multi:'多选题', tf:'判断题', case:'案例题'};
const TYPE_CLS = {single:'single', multi:'multi', tf:'tf', case:'case'};
const qid = q=>q.id;
function getQ(id){ return QS.find(q=>q.id===id); }
function letterAns(q){ return q.answer||''; }
function isMulti(q){ return q.type==='multi'; }
function isCorrect(q, sel){
  if(!sel) return false;
  const a = (q.answer||'').toUpperCase().split('').sort().join('');
  const s = String(sel).toUpperCase().split('').sort().join('');
  return a && a===s;
}
function todayStat(){ const d=today(); S.stats.byDay[d] = S.stats.byDay[d]||{d:0,r:0}; return S.stats.byDay[d]; }

/* ================= 倒计时 ================= */
function targetDate(){
  if(!S.examDate) return null;
  const t = (S.examTime||'09:00').split(':');
  const dt = new Date(S.examDate+'T'+String(t[0]||9).padStart(2,'0')+':'+String(t[1]||0).padStart(2,'0')+':00');
  return isNaN(dt) ? null : dt;
}
function tickExamCountdown(){
  const box=$('#cdExam'), num=$('#cdExamNum');
  const target = targetDate();
  if(!target){ num.textContent='设置日期'; box.classList.remove('urgent'); return; }
  const ms = target - new Date();
  if(ms<=0){ num.textContent='已开考'; box.classList.add('urgent'); return; }
  const d = Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000);
  num.textContent = d>0 ? `${d}天 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
                        : `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  box.classList.toggle('urgent', d<7);
}
setInterval(tickExamCountdown, 1000);

/* ================= 练习 ================= */
let SES = null; // {list:[qid], pos, mode, exam:false}
function startSession(mode, opts={}){
  let list=[];
  if(mode==='practice') list = QS.map(q=>q.id);
  else if(mode==='random') list = shuffle(QS.map(q=>q.id));
  else if(mode==='wrong') list = S.wrong.slice();
  else if(mode==='fav') list = S.fav.slice();
  else if(mode==='doubt') list = QS.filter(q=>(q.issue&&q.issue.level)||S.doubt.includes(q.id)).map(q=>q.id);
  if(opts.type && opts.type!=='all') list = list.filter(id=>getQ(id) && getQ(id).type===opts.type);
  if(!list.length){ toast('这里还没有题目'); return; }
  SES={list, pos:0, mode, exam:false};
  if(opts.jump){ const i=list.indexOf(opts.jump); if(i>=0) SES.pos=i; }
  if(opts.pos!=null) SES.pos=Math.max(0,Math.min(list.length-1,opts.pos));
  go(mode==='wrong'?'wrong':mode==='fav'?'fav':mode==='doubt'?'doubt':(mode==='random'?'random':'practice'), {session:true});
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderPractice(c, opts){
  if(!SES || !SES.list.length || (view==='practice'&&SES.mode!=='practice') || (view==='random'&&SES.mode!=='random')
     || (view==='wrong'&&SES.mode!=='wrong') || (view==='fav'&&SES.mode!=='fav') || (view==='doubt'&&SES.mode!=='doubt')){
    // 起始页
    const mode = view;
    const wrap=el('div','card pad');
    const count = mode==='practice'?QS.length : mode==='random'?QS.length : mode==='wrong'?S.wrong.length : mode==='fav'?S.fav.length : QS.filter(q=>(q.issue&&q.issue.level)||S.doubt.includes(q.id)).length;
    wrap.innerHTML=`<h2 class="sec"><span class="dot"></span>${mode==='wrong'?'错题重练':mode==='fav'?'收藏重练':mode==='doubt'?'存疑题重刷':'开始练习'}</h2>
      <p class="muted" style="margin:0 0 16px">共 ${count} 题。选择题型后可开始；作答后立即显示对错与解析。</p>`;
    const types=[['all','全部题型',count],['single','单选题',0],['tf','判断题',0],['multi','多选题',0],['case','案例题',0]];
    const bar=el('div',''); bar.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
    let sel='all';
    types.forEach(([t,label])=>{
      const b=el('button','btn sm', esc(label));
      if(t!=='all'){
        const n = (mode==='practice'?QS:(mode==='wrong'?S.wrong.map(getQ):mode==='fav'?S.fav.map(getQ):QS)).filter(q=>q&&q.type===t).length;
        b.innerHTML = esc(label)+` <span class="muted">${n}</span>`;
      }
      b.onclick=()=>{ sel=t; bar.querySelectorAll('button').forEach(x=>x.classList.remove('primary')); b.classList.add('primary'); startSession(mode,{type:t}); };
      if(t==='all') b.classList.add('primary');
      bar.appendChild(b);
    });
    wrap.appendChild(bar);
    const act=el('div','actions');

    act.appendChild(b1);
    if(SES) { const b2=el('button','btn','继续上次（第'+(SES.pos+1)+'题）'); b2.onclick=()=>{SES.mode=mode; render();}; act.appendChild(b2); }
    wrap.appendChild(act);
    c.appendChild(wrap);
    return;
  }
  drawQuestion(c);
}

function drawQuestion(c){
  const id = SES.list[SES.pos];
  const q = getQ(id);
  if(!q){ nextQ(); return; }
  const rec = S.answers[id];
  const showAns = !!rec;   // 已答过即显示答案
  const pending = (SES._sel && SES._sel[id]) || '';
  const sel = rec ? rec.sel : (pending || null);

  const card = el('div','card pad');
  const issue = q.issue;

  const head = el('div','qhead');
  head.innerHTML = `<span class="qno">第 ${SES.pos+1} / ${SES.list.length} 题</span>
    <span class="pill ${TYPE_CLS[q.type]}">${TYPE_LABEL[q.type]||''}</span>
    ${q.chapter?`<span class="pill">${esc(q.chapter)}</span>`:''}
    ${q.no?`<span class="pill">原题号 ${esc(q.no)}</span>`:''}
    ${issue&&issue.level==='high'?`<span class="pill" style="background:var(--bad-soft);color:var(--bad)">⚠ 答案存疑</span>`:''}
    ${issue&&issue.level==='mid'?`<span class="pill" style="background:var(--warn-soft);color:var(--warn)">⚠ 有争议</span>`:''}
    ${issue&&issue.level==='info'?`<span class="pill" style="background:var(--brand-soft);color:var(--brand)">ⓘ 备注</span>`:''}
    ${S.fav.includes(id)?'<span class="pill" style="background:var(--warn-soft);color:var(--warn)">★ 已收藏</span>':''}`;
  card.appendChild(head);

  const stem = el('div','stem'); stem.textContent = q.stem; card.appendChild(stem);

  const opts = el('div','opts');
  const optEls = {};
  (q.options||[]).forEach(o=>{
    const b = el('button','opt');
    b.dataset.k = o.k;
    b.innerHTML = `<span class="k">${esc(o.k)}</span><span class="txt">${esc(o.t)}</span>`;
    if(showAns){
      const ansArr = (q.answer||'').split('');
      if(ansArr.includes(o.k)){ b.classList.add('right'); b.insertAdjacentHTML('beforeend','<span class="tag">正确答案</span>'); }
      if(sel && sel.includes(o.k) && !ansArr.includes(o.k)){ b.classList.add('wrong'); b.insertAdjacentHTML('beforeend','<span class="tag">你选的</span>'); }
      b.classList.add('locked');
    } else if(sel && sel.includes(o.k)){ b.classList.add('sel'); }
    b.onclick = ()=>choose(id, o.k);
    optEls[o.k]=b;
    opts.appendChild(b);
  });
  card.appendChild(opts);

  // 简答/案例题：无选项，提供参考答案 + 自评
  const isQA = !(q.options||[]).length;
  if(isQA){
    const ref = el('div','explain hide');
    ref.innerHTML = '<span class="lbl">参考答案</span>' + esc(q.explain || '（原题未提供参考答案）');
    const tbar = el('div','actions');
    const tb = el('button','btn','展开参考答案');
    tb.onclick = ()=>{ ref.classList.toggle('hide'); tb.textContent = ref.classList.contains('hide') ? '展开参考答案' : '收起参考答案'; };
    tbar.appendChild(tb);
    if(!showAns){
      tbar.insertAdjacentHTML('beforeend','<span class="muted" style="margin-left:6px">对照参考答案自评：</span>');
      const ok = el('button','btn primary','我答对了'); ok.onclick=()=>selfAssess(id,true);
      const no = el('button','btn','没答对'); no.onclick=()=>selfAssess(id,false);
      tbar.append(ok,no);
    }
    card.appendChild(tbar);
    card.appendChild(ref);
  }

  // 多选需要提交按钮
  if(!showAns && isMulti(q)){
    const act=el('div','actions');
    act.innerHTML='<span class="muted">多选题：选好全部选项后点「提交答案」</span>';
    const sub=el('button','btn primary','提交答案');
    sub.onclick=()=>submitMulti(id);
    act.appendChild(sub);
    card.appendChild(act);
  }

  if(showAns){
    const ok = rec.ok;
    const isQA = !(q.options||[]).length;
    const fb = el('div','feedback '+(ok?'ok':'bad'));
    if(isQA){
      fb.innerHTML = ok
        ? `<span>✓ 已掌握（自评答对）</span>`
        : `<span>✗ 未掌握（自评未答对）</span><span style="margin-left:auto;font-weight:700">对照参考答案再复习一遍</span>`;
    } else {
      fb.innerHTML = ok
      ? `<span>✓ 回答正确</span><span style="margin-left:auto;font-weight:700">正确答案：${esc(q.answer)}</span>`
      : `<span>✗ 回答错误</span><span style="margin-left:auto;font-weight:700">你的作答：${esc(rec.sel||'未选')} ｜ 正确答案：${esc(q.answer)}</span>`;
    }
    card.appendChild(fb);

    if(q.explain){
      const ex=el('div','explain');
      ex.innerHTML=`<span class="lbl">解析</span>`+esc(q.explain);
      card.appendChild(ex);
    }
    if(issue && issue.level){
      const cls = issue.level==='high' ? 'hi' : issue.level==='info' ? 'info' : '';
      const title = issue.level==='high' ? '⚠ 本题答案疑似有误'
                  : issue.level==='mid' ? '⚠ 本题答案存在争议'
                  : 'ⓘ 题目备注';
      const iss=el('div','issue '+cls);
      iss.innerHTML=`<div class="hd">${title}</div>
        <div>${esc(issue.note||'')}</div>
        ${issue.suggest?`<div style="margin-top:6px">建议答案：<span class="sug">${esc(issue.suggest)}</span></div>`:''}`;
      card.appendChild(iss);
    }
    if(S.notes[id]){
      const nt=el('div','explain'); nt.innerHTML=`<span class="lbl">我的笔记</span>`+esc(S.notes[id]); card.appendChild(nt);
    }
  }

  // 操作条
  const act=el('div','actions');
  const prev=el('button','btn','← 上一题'); prev.disabled = SES.pos<=0; prev.onclick=()=>{SES.pos--; render();};
  const next=el('button','btn primary','下一题 →'); next.onclick=()=>nextQ();
  const fav=el('button','btn', S.fav.includes(id)?'★ 已收藏':'☆ 收藏');
  fav.onclick=()=>{ toggle(S.fav,id); toast(S.fav.includes(id)?'已收藏':'已取消收藏'); updateCounts(); render(); };
  const doubt=el('button','btn ghost', S.doubt.includes(id)?'已标记存疑':'⚠ 标记存疑');
  doubt.onclick=()=>{ toggle(S.doubt,id); updateCounts(); toast(S.doubt.includes(id)?'已标记为答案存疑':'已取消标记'); render(); };
  const note=el('button','btn ghost','✎ 笔记');
  note.onclick=()=>openNote(id);
  act.append(prev,next,fav,doubt,note);
  card.appendChild(act);
  c.appendChild(card);

  // 答题卡
  const sheet=el('div','card pad'); sheet.style.marginTop='14px';
  sheet.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h2 class="sec" style="margin:0"><span class="dot"></span>答题卡</h2>
      <span class="muted">已答 ${SES.list.filter(x=>S.answers[x]).length} / ${SES.list.length}</span></div>`;
  const grid=el('div','sheet');
  SES.list.forEach((qid2,i)=>{
    const b=el('button',null,String(i+1));
    if(i===SES.pos) b.classList.add('cur');
    const r=S.answers[qid2];
    if(r) b.classList.add(r.ok?'ok':'bad');
    b.onclick=()=>{ SES.pos=i; render(); };
    grid.appendChild(b);
  });
  sheet.appendChild(grid);
  const lg=el('div','legend');
  lg.innerHTML=`<span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>答对</span>
    <span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>答错</span>
    <span><i style="background:var(--bg);border:1px solid var(--line)"></i>未答</span>
    <span>点击题号可跳转</span>`;
  sheet.appendChild(lg);
  c.appendChild(sheet);
}

function toggle(arr, v){ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); save(); }
function choose(id, k){
  const q=getQ(id); const rec=S.answers[id];
  if(rec) return;               // 已答，锁定
  if(isMulti(q)){
    const cur = (SES._sel&&SES._sel[id]) || '';
    const nx = cur.includes(k) ? cur.replace(k,'') : (cur+k).split('').sort().join('');
    SES._sel = SES._sel||{}; SES._sel[id]=nx;
    render(); return;
  }
  commit(id, k);
}
function submitMulti(id){
  const sel = (SES._sel&&SES._sel[id])||'';
  if(!sel){ toast('请先选择选项'); return; }
  commit(id, sel);
}
function selfAssess(id, ok){
  S.answers[id]={sel:'自评', ok, ts:Date.now()};
  const ts=todayStat(); ts.d++; if(ok) ts.r++;
  S.stats.done++; if(ok) S.stats.right++;
  if(!ok && !S.wrong.includes(id)) S.wrong.push(id);
  if(ok && S.wrong.includes(id)) S.wrong=S.wrong.filter(x=>x!==id);
  save(); render();
}
function commit(id, sel){
  const q=getQ(id);
  if(SES && SES._sel) delete SES._sel[id];
  const ok = isCorrect(q, sel);
  S.answers[id]={sel, ok, ts:Date.now()};
  const ts=todayStat(); ts.d++; if(ok) ts.r++;
  S.stats.done++; if(ok) S.stats.right++;
  if(!ok && !S.wrong.includes(id)) S.wrong.push(id);
  if(ok && S.wrong.includes(id)){ /* 保留错题，直到手动移除 or 错题模式答对 */ if(SES&&SES.mode==='wrong'){ S.wrong=S.wrong.filter(x=>x!==id); } }
  // streak
  const d=today();
  if(S.stats.streak.last!==d){ S.stats.streak.last=d; S.stats.streak.n=(S.stats.streak.n||0)+1; }
  save();
  if(SES.exam) return;
  render();
  setTimeout(()=>{ const n=document.querySelector('.actions .btn.primary'); if(n&&!SES.showAns) {} },0);
}
function nextQ(){
  if(!SES) return;
  if(SES.pos < SES.list.length-1){ SES.pos++; render(); }
  else {
    const answered=SES.list.filter(x=>S.answers[x]).length;
    toast(`本轮完成！已答 ${answered} 题`);
  }
}

/* 笔记 */

function openNote(id){
  const m=$('#modal'), b=$('#modalBox');
  b.innerHTML=`<h3>笔记 · 第 ${esc(getQ(id).no||'')} 题</h3>
    <textarea id="noteTa" placeholder="记录易错点、记忆口诀…">${esc(S.notes[id]||'')}</textarea>
    <div class="actions"><button class="btn primary" id="noteSave">保存</button><button class="btn" id="noteClose">取消</button></div>`;
  m.classList.add('show');
  $('#noteSave').onclick=()=>{ const v=$('#noteTa').value.trim(); if(v) S.notes[id]=v; else delete S.notes[id]; save(); m.classList.remove('show'); toast('笔记已保存'); render(); };
  $('#noteClose').onclick=()=>m.classList.remove('show');
  $('#noteTa').focus();
}

/* ================= 列表（错题/收藏/存疑） ================= */
function renderList(c){
  let ids = view==='wrong'? S.wrong.slice() : view==='fav'? S.fav.slice()
    : QS.filter(q=>(q.issue&&q.issue.level)||S.doubt.includes(q.id)).map(q=>q.id);
  if(!ids.length){
    const e=el('div','card empty');
    e.innerHTML=`<div class="big">${view==='wrong'?'🎉':view==='fav'?'☆':'✓'}</div>
      <div style="font-weight:700;font-size:15px;color:var(--ink)">${view==='wrong'?'还没有错题':view==='fav'?'还没有收藏':'没有存疑题'}</div>
      <div class="muted" style="margin-top:6px">${view==='wrong'?'继续保持！':'去练习时点击收藏/标记'}</div>`;
    c.appendChild(e); return;
  }
  const card=el('div','card pad');
  card.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <h2 class="sec" style="margin:0"><span class="dot"></span>共 ${ids.length} 题</h2>
    <div style="display:flex;gap:8px"><button class="btn sm primary" id="goAll">全部重做</button>
    ${view==='wrong'?'<button class="btn sm" id="clearWrong">清空错题</button>':''}</div></div>
    ${view==='doubt'?`<div class="muted" style="margin-bottom:10px">含三类：<b style="color:var(--bad)">⚠ 答案存疑</b>（答案疑似错误，附建议答案）、<b style="color:var(--warn)">⚠ 有争议</b>（多解/表述不严谨）、<b style="color:var(--brand)">ⓘ 备注</b>（排版或配图问题）。这也是你自己手动标记的题。</div>`:''}`;
  ids.forEach(id=>{
    const q=getQ(id); if(!q) return;
    const r=el('div','row'); r.style.cursor='pointer';
    const iss=q.issue&&q.issue.level;
    r.innerHTML=`<div class="no">${esc(q.no||'')}</div>
      <div class="body"><p>${esc(q.stem)}</p>
      <div class="meta"><span class="pill ${TYPE_CLS[q.type]}">${TYPE_LABEL[q.type]||''}</span>
      <span>答案 ${esc(q.answer)}</span>${S.answers[id]?`<span>你答 ${esc(S.answers[id].sel)}</span>`:''}
      ${iss?`<span style="color:var(--bad);font-weight:700">⚠ 答案存疑</span>`:''}
      ${(q.issue&&q.issue.level==='mid')?`<span style="color:var(--warn);font-weight:700">⚠ 有争议</span>`:''}
      ${(q.issue&&q.issue.level==='info')?`<span style="color:var(--brand)">ⓘ 备注</span>`:''}</div></div>`;
    r.onclick=()=>{ startSession(view==='wrong'?'wrong':view==='fav'?'fav':'doubt',{jump:id}); };
    card.appendChild(r);
  });
  c.appendChild(card);
  card.querySelector('#goAll').onclick=()=>startSession(view==='wrong'?'wrong':view==='fav'?'fav':'doubt');
  const cw=card.querySelector('#clearWrong'); if(cw) cw.onclick=()=>{ if(confirm('确定清空全部错题？')){ S.wrong=[]; save(); updateCounts(); render(); } };
}

/* ================= 模拟考试 ================= */
function renderExam(c){
  if(S.exam && S.exam.active){ drawExam(c); return; }
  if(S.exam && !S.exam.active){ drawExamResult(c); return; }
  const st=S.settings;
  const card=el('div','card pad');
  card.innerHTML=`<h2 class="sec"><span class="dot"></span>模拟考试设置</h2>
   <div class="grid g3" style="margin:16px 0">
     <div class="stat"><div class="k">考试时长</div><div class="v">${st.duration}<small>分钟</small></div></div>
     <div class="stat"><div class="k">总分 / 及格线</div><div class="v">100<small>分 · ${st.passScore}及格</small></div></div>
     <div class="stat"><div class="k">抽题数量</div><div class="v">${st.single+st.tf+st.multi}<small>题</small></div></div>
   </div>
   <p class="muted" style="margin:0 0 4px">试卷结构：单选题 ${st.single} 题 ×1 分 ｜ 判断题 ${st.tf} 题 ×1 分 ｜ 多选题 ${st.multi} 题 ×${st.multiScore} 分</p>
   <p class="muted" style="margin:0 0 16px">四川省职业技能等级认定《理论知识》科目：90 分钟、百分制、60 分及格。多选题少选/错选不得分。</p>`;
  const act=el('div','actions');
  const b=el('button','btn primary','开始考试 →');
  b.onclick=()=>startExam();
  const b2=el('button','btn','调整设置'); b2.onclick=()=>openSettings(true);
  act.append(b,b2);
  card.appendChild(act);
  c.appendChild(card);

  const rule=el('div','card pad'); rule.style.marginTop='14px';
  rule.innerHTML=`<h2 class="sec"><span class="dot"></span>考试规则（四川 · 成都）</h2>
    <div style="font-size:13.8px;line-height:1.95;color:var(--ink2)">
    · 科目构成：理论知识（90 分钟）+ 技能考核（120 分钟），两科分别计时。<br>
    · 及格标准：两科各 60 分及格，任一科不达线即不通过。<br>
    · 理论题型：单选题、判断题、多选题为主，部分批次含案例（情景）题。<br>
    · 本工作台模拟卷按 100 分制折算，交卷后给出得分、正确率与逐题解析。<br>
    · 以当期评价机构公告与考核大纲为准，本页规则仅作练习参考。</div>`;
  c.appendChild(rule);
}

function startExam(){
  const st=S.settings;
  const pick=(type,n)=>shuffle(QS.filter(q=>q.type===type).map(q=>q.id)).slice(0,n);
  let ids=[...pick('single',st.single),...pick('tf',st.tf),...pick('multi',st.multi)];
  if(st.shuffle) ids=shuffle(ids);
  if(ids.length<5){ toast('题库数量不足'); return; }
  S.exam={active:true, ids, pos:0, sel:{}, start:Date.now(), end:Date.now()+st.duration*60000, left:st.duration*60};
  save();
  render();
}

let examTimer=null;
function drawExam(c){
  const E=S.exam;
  const q=getQ(E.ids[E.pos]);
  const card=el('div','card pad');
  const left = Math.max(0, Math.floor((E.end - Date.now())/1000));
  const mm=String(Math.floor(left/60)).padStart(2,'0'), ss=String(left%60).padStart(2,'0');
  const bar=el('div','exambar'+(left<300?' danger':''));
  bar.innerHTML=`<div><div class="muted">剩余时间</div><div class="t">${mm}:${ss}</div></div>
    <div style="flex:1;min-width:120px"><div class="muted" style="margin-bottom:5px">进度 ${E.pos+1} / ${E.ids.length} · 已答 ${Object.keys(E.sel).length}</div>
    <div class="qbar"><i style="width:${(E.pos+1)/E.ids.length*100}%"></i></div></div>
    <button class="btn" id="exSheet">答题卡</button>
    <button class="btn primary" id="exSubmit">交卷</button>`;
  c.appendChild(bar);

  const head=el('div','qhead');
  head.innerHTML=`<span class="qno">第 ${E.pos+1} 题</span>
    <span class="pill ${TYPE_CLS[q.type]}">${TYPE_LABEL[q.type]}</span>
    ${isMulti(q)?'<span class="pill" style="background:#f3ebff;color:#7b3fe4">可多选</span>':''}`;
  card.appendChild(head);
  const stem=el('div','stem'); stem.textContent=q.stem; card.appendChild(stem);
  const opts=el('div','opts');
  (q.options||[]).forEach(o=>{
    const cur=(E.sel[q.id]||'');
    const b=el('button','opt'+(cur.includes(o.k)?' sel':''));
    b.innerHTML=`<span class="k">${esc(o.k)}</span><span class="txt">${esc(o.t)}</span>`;
    b.onclick=()=>{
      if(isMulti(q)){
        const nx = cur.includes(o.k)? cur.replace(o.k,'') : [...(cur+o.k)].sort().join('');
        if(nx) E.sel[q.id]=nx; else delete E.sel[q.id];
      } else { E.sel[q.id]=o.k; }
      save(); render();
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  const act=el('div','actions');
  const prev=el('button','btn','← 上一题'); prev.disabled=E.pos<=0; prev.onclick=()=>{E.pos--;save();render();};
  const next=el('button','btn', E.pos>=E.ids.length-1?'已是最后一题':'下一题 →'); next.onclick=()=>{ if(E.pos<E.ids.length-1){E.pos++;save();render();} };
  act.append(prev,next);
  card.appendChild(act);
  c.appendChild(card);

  if(!examTimer) examTimer=setInterval(()=>{
    if(!S.exam||!S.exam.active){ clearInterval(examTimer); examTimer=null; return; }
    const l=Math.floor((S.exam.end-Date.now())/1000);
    if(l<=0){ clearInterval(examTimer); examTimer=null; submitExam(true); return; }
    if(view==='exam'){ const t=document.querySelector('.exambar .t'); if(t){ const mm=String(Math.floor(l/60)).padStart(2,'0'),ss=String(l%60).padStart(2,'0'); t.textContent=mm+':'+ss; const box=document.querySelector('.exambar'); if(box) box.classList.toggle('danger', l<300); } }
  },1000);

  bar.querySelector('#exSubmit').onclick=()=>{ if(confirm('确定交卷？未答题目按 0 分计。')) submitExam(); };
  bar.querySelector('#exSheet').onclick=()=>openExamSheet();
}

function openExamSheet(){
  const E=S.exam, m=$('#modal'), b=$('#modalBox');
  b.innerHTML=`<h3>答题卡 · 已答 ${Object.keys(E.sel).length} / ${E.ids.length}</h3>`;
  const g=el('div','sheet');
  E.ids.forEach((id,i)=>{
    const btn=el('button',null,String(i+1));
    if(E.sel[id]) btn.classList.add('done');
    if(i===E.pos) btn.classList.add('cur');
    btn.onclick=()=>{ E.pos=i; save(); m.classList.remove('show'); render(); };
    g.appendChild(btn);
  });
  b.appendChild(g);
  const act=el('div','actions');
  const close=el('button','btn','关闭'); close.onclick=()=>m.classList.remove('show');
  const sub=el('button','btn primary','交卷');
  sub.onclick=()=>{ m.classList.remove('show'); if(confirm('确定交卷？')) submitExam(); };
  act.append(close,sub); b.appendChild(act);
  m.classList.add('show');
}

function submitExam(auto){
  const E=S.exam, st=S.settings;
  let score=0, right=0;
  const detail=[];
  E.ids.forEach(id=>{
    const q=getQ(id), sel=E.sel[id]||'';
    const ok=isCorrect(q,sel);
    const pts = q.type==='multi'? st.multiScore : 1;
    if(ok) score+=pts;
    if(ok) right++;
    detail.push({id,sel,ok});
    if(!ok && !S.wrong.includes(id)) S.wrong.push(id);
  });
  score = Math.round(score);
  const ts=todayStat(); ts.d+=E.ids.length; ts.r+=right;
  S.stats.done+=E.ids.length; S.stats.right+=right;
  S.exam={active:false, score, right, total:E.ids.length, detail, at:Date.now(), auto:!!auto};
  save(); updateCounts(); render();
  setTimeout(()=>toast(auto?'时间到，已自动交卷':'交卷完成，得分 '+score),300);
}

function drawExamResult(c){
  const E=S.exam, st=S.settings;
  const pass = E.score>=st.passScore;
  const rate = Math.round(E.right/E.total*100);
  const card=el('div','card pad');
  card.innerHTML=`<div style="text-align:center;padding:10px 0 4px">
      <div style="font-size:13px;color:var(--ink3)">${E.auto?'时间到自动交卷':'本次模拟考试得分'}</div>
      <div style="font-size:56px;font-weight:800;line-height:1.1;color:${pass?'var(--ok)':'var(--bad)'}">${E.score}<small style="font-size:18px;color:var(--ink3)">/100</small></div>
      <div style="font-weight:800;margin-top:6px;color:${pass?'var(--ok)':'var(--bad)'}">${pass?'✓ 及格':'✗ 未及格'}</div>
      <div class="muted" style="margin-top:6px">答对 ${E.right}/${E.total} 题 · 正确率 ${rate}% · 及格线 ${st.passScore} 分</div>
    </div>`;
  const act=el('div','actions'); act.style.justifyContent='center';
  const b1=el('button','btn primary','再来一套'); b1.onclick=()=>{ S.exam=null; save(); render(); };
  const b2=el('button','btn','查看错题'); b2.onclick=()=>{ S.exam=null; save(); go('wrong'); };
  act.append(b1,b2); card.appendChild(act);
  c.appendChild(card);

  const list=el('div','card pad'); list.style.marginTop='14px';
  list.innerHTML=`<h2 class="sec"><span class="dot"></span>逐题回顾</h2>`;
  E.detail.forEach((d,i)=>{
    const q=getQ(d.id);
    const r=el('div','row');
    r.innerHTML=`<div class="no" style="color:${d.ok?'var(--ok)':'var(--bad)'}">${d.ok?'✓':'✗'}</div>
      <div class="body"><p>${i+1}. ${esc(q.stem)}</p>
      <div class="meta"><span class="pill ${TYPE_CLS[q.type]}">${TYPE_LABEL[q.type]}</span>
      <span>你答 ${esc(d.sel||'未答')}</span><span>正确答案 ${esc(q.answer)}</span>
      ${q.issue&&q.issue.level?'<span style="color:var(--bad);font-weight:700">⚠ 答案存疑</span>':''}</div></div>`;
    list.appendChild(r);
  });
  c.appendChild(list);
}

/* ================= 统计 ================= */
function renderStats(c){
  const total=QS.length, answered=Object.keys(S.answers).length;
  const right=Object.values(S.answers).filter(a=>a.ok).length;
  const byType={single:[0,0],tf:[0,0],multi:[0,0],case:[0,0]};
  QS.forEach(q=>{ if(S.answers[q.id]){ byType[q.type][0]++; if(S.answers[q.id].ok) byType[q.type][1]++; } });
  const card=el('div','card pad');
  card.innerHTML=`<h2 class="sec"><span class="dot"></span>总体进度</h2>
   <div class="grid g4" style="margin-bottom:18px">
     <div class="stat"><div class="k">已练题数</div><div class="v">${answered}<small>/ ${total}</small></div></div>
     <div class="stat"><div class="k">正确率</div><div class="v">${answered?Math.round(right/answered*100):0}<small>%</small></div></div>
     <div class="stat"><div class="k">错题</div><div class="v">${S.wrong.length}<small>题</small></div></div>
     <div class="stat"><div class="k">连续打卡</div><div class="v">${S.stats.streak.n||0}<small>天</small></div></div>
   </div>
   <h2 class="sec"><span class="dot"></span>各题型正确率</h2>
   <div class="bars">${Object.entries(byType).map(([t,[a,r]])=>{
      const p=a?Math.round(r/a*100):0;
      return `<div class="bar"><span>${TYPE_LABEL[t]}</span>
        <div class="track"><i style="width:${p}%"></i></div>
        <span class="v">${p}%</span></div>`;
   }).join('')}</div>`;
  c.appendChild(card);

  const days=Object.entries(S.stats.byDay).sort((a,b)=>a[0]<b[0]?-1:1).slice(-14);
  const d2=el('div','card pad'); d2.style.marginTop='14px';
  const max=Math.max(1,...days.map(([,v])=>v.d));
  d2.innerHTML=`<h2 class="sec"><span class="dot"></span>近 14 天答题量</h2>
    <div style="display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:10px">
      ${days.length?days.map(([d,v])=>`<div style="flex:1;text-align:center">
        <div title="${d} 答${v.d}对${v.r}" style="height:${Math.max(4,v.d/max*90)}px;background:linear-gradient(180deg,#2c5cff,#7b5cff);border-radius:5px 5px 2px 2px"></div>
        <div style="font-size:9.5px;color:var(--ink3);margin-top:5px">${d.slice(5)}</div></div>`).join(''):'<div class="muted">暂无数据</div>'}
    </div>`;
  c.appendChild(d2);
}

/* ================= 设置 ================= */
function openSettings(fromExam){
  const m=$('#modal'), b=$('#modalBox');
  const st=S.settings;
  b.innerHTML=`<h3>设置</h3>
    <div class="field"><label>考试日期<span class="hint">顶部倒计时使用</span></label><input type="date" id="sDate" value="${esc(S.examDate)}"></div>
    <div class="field"><label>开考时间</label><input type="time" id="sTime" value="${esc(S.examTime||'09:00')}"></div>
    <div class="field"><label>模拟考时长（分钟）</label><input type="number" id="sDur" min="10" max="300" value="${st.duration}" style="width:90px"></div>
    <div class="field"><label>及格分</label><input type="number" id="sPass" min="1" max="100" value="${st.passScore}" style="width:90px"></div>
    <div class="field"><label>单选题数</label><input type="number" id="sSingle" min="0" max="231" value="${st.single}" style="width:90px"></div>
    <div class="field"><label>判断题数</label><input type="number" id="sTf" min="0" max="30" value="${st.tf}" style="width:90px"></div>
    <div class="field"><label>多选题数</label><input type="number" id="sMulti" min="0" max="30" value="${st.multi}" style="width:90px"></div>
    <div class="field"><label>多选题分值</label><input type="number" id="sMs" min="1" max="10" value="${st.multiScore}" style="width:90px"></div>
    <div class="actions" style="margin-top:20px">
      <button class="btn primary" id="sSave">保存</button>
      <button class="btn" id="sCancel">取消</button>
      <button class="btn ghost" id="sReset" style="margin-left:auto">清空所有学习记录</button>
    </div>`;
  m.classList.add('show');
  $('#sCancel').onclick=()=>m.classList.remove('show');
  $('#sReset').onclick=()=>{ if(confirm('将清空作答记录、错题、收藏、笔记（保留题库）。确定？')){ const keep=S.examDate, keepT=S.examTime; localStorage.removeItem(LS_KEY); S=defaultState(); S.examDate=keep; S.examTime=keepT; save(); m.classList.remove('show'); render(); updateCounts(); toast('已重置'); } };
  $('#sSave').onclick=()=>{
    S.examDate=$('#sDate').value; S.examTime=$('#sTime').value||'09:00';
    st.duration=+$('#sDur').value||90; st.passScore=+$('#sPass').value||60;
    st.single=+$('#sSingle').value; st.tf=+$('#sTf').value; st.multi=+$('#sMulti').value; st.multiScore=+$('#sMs').value||2;
    save(); m.classList.remove('show'); tickExamCountdown(); toast('设置已保存'); render();
  };
}

/* ================= 事件 ================= */
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{ SES=null; go(b.dataset.view); });
$('#btnMenu').onclick=()=>{ $('#side').classList.toggle('open'); $('#backdrop').classList.toggle('show'); };
$('#backdrop').onclick=()=>{ $('#side').classList.remove('open'); $('#backdrop').classList.remove('show'); };
$('#btnSettings').onclick=()=>openSettings();
$('#cdExam').onclick=()=>openSettings();
$('#btnTheme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nx=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nx);
  localStorage.setItem('aitrainer_theme',nx);
  $('#btnTheme').textContent = nx==='dark'?'◑ 浅色模式':'◐ 深色模式';
};
if(localStorage.getItem('aitrainer_theme')==='dark'){ document.documentElement.setAttribute('data-theme','dark'); $('#btnTheme').textContent='◑ 浅色模式'; }
$('#modal').onclick=e=>{ if(e.target.id==='modal') e.currentTarget.classList.remove('show'); };

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  const k=e.key.toUpperCase();
  if(!SES || SES.exam || !document.querySelector('.opts')) return;
  const q=getQ(SES.list[SES.pos]);
  if(['A','B','C','D','E'].includes(k)){
    if(q.options.some(o=>o.k===k)) { choose(q.id,k); e.preventDefault(); }
  } else if(e.key==='Enter'){ nextQ(); }
  else if(k==='F'){ toggle(S.fav,q.id); updateCounts(); render(); }
  else if(k==='X'){ toggle(S.doubt,q.id); updateCounts(); render(); }
  else if(e.key==='ArrowLeft'){ if(SES.pos>0){SES.pos--;render();} }
  else if(e.key==='ArrowRight'){ nextQ(); }
});

/* ================= 启动 ================= */
tickExamCountdown();
updateCounts();
go('home');
</script>
</body>
</html>
